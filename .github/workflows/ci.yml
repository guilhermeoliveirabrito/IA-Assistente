name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependências
        run: pip install ruff pypdf python-docx pyyaml pillow
      - name: Estilo (ruff)
        run: ruff check .
      - name: Testes Python
        run: python -m unittest discover -s tests -t .
      - name: Testes do Markdown
        run: node web/tests/md.test.js

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install playwright pypdf python-docx pyyaml pillow
      - name: Navegador
        run: playwright install --with-deps chromium
      - name: Teste de fumaça da interface (desktop e celular)
        run: python tests_ui/smoke.py
