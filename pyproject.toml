[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["memory", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E701", "E702", "E741", "E731", "E743",  # estilo compacto e nomes curtos são escolha consciente do projeto
  "B008", "B904", "B905", "UP015", "UP035",
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["assistente"]
