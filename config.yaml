# Suas regras. Edite à vontade; não precisa mexer no código.

ia:
  # Se der erro de "modelo não encontrado", troque pelo nome atual em https://ai.google.dev/gemini-api/docs/models
  modelo: "gemini-3.8-flash"
  # Se a cota do modelo principal acabar (ou ele sair do ar), tenta estes, em ordem.
  # A cota gratuita é separada por modelo, então isso estica o uso do dia.
  modelos_reserva:
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"
    - "gemini-3.1-flash-lite"
  # Quanto o modelo "pensa" antes de responder (só modelos Gemini 3): minimal, low, medium, high ou auto.
  # Pensar menos deixa cada passo MUITO mais rápido. No controle do PC, cada passo é só "olhar a tela e escolher o
  # próximo clique", então o padrão lá é minimal. Nas conversas normais, auto (o modelo decide).
  raciocinio: auto
  raciocinio_pc: minimal

# Limites usados pelo medidor de consumo do app. O Gemini não informa a cota restante,
# então o app conta as chamadas e compara com estes números.
# Confira os seus limites reais em https://aistudio.google.com/rate-limit e ajuste aqui.
limites:
  requisicoes_por_dia: 250
  requisicoes_por_minuto: 10
  tokens_por_minuto: 250000
  # O limite é DIFERENTE para cada modelo. Os números acima valem para todos, como ESTIMATIVA. Quando o Google recusa
  # uma chamada, o app aprende o limite real daquele modelo sozinho. Se você já sabe os limites (painel em
  # aistudio.google.com/rate-limit), escreva um por linha: "modelo=por_dia,por_minuto,tokens_por_minuto".
  # Conferidos no seu painel (AI Studio › Limites de taxa) em 23/10/2026. Formato: modelo=por_dia,por_minuto,tokens_por_minuto
  por_modelo:
    - "gemini-3.8-flash=20,5,250000"
    - "gemini-3.6-flash=20,5,250000"
    - "gemini-3.5-flash-lite=500,15,250000"
    - "gemini-3.1-flash-lite=500,15,250000"
    - "gemini-3-flash=20,5,250000"
    - "gemini-2.5-flash=20,5,250000"
    - "gemini-2.5-flash-lite=20,10,250000"
  fuso_renovacao: "America/Los_Angeles"   # a cota diária renova à meia-noite do Pacífico
  hora_renovacao: "00:00"

# Histórico do que o assistente planejou e fez. Se apaga sozinho depois destes dias.
historico:
  dias_de_retencao: 7
  maximo_de_eventos: 5000

email:
  max_por_rodada: 25
  # Emails desses remetentes (parte do endereço ou nome) são SEMPRE importantes e nunca vão para a lixeira
  remetentes_vip:
    - "seuchefe@empresa.com"
    - "banco"
  # O que é "importante de verdade" para você. Escreva do seu jeito:
  criterios_importante:
    - "Pede uma resposta ou decisão minha, ou tem prazo"
    - "Envolve dinheiro, cobrança, contrato, boleto ou documento oficial"
    - "É de uma pessoa real escrevendo diretamente para mim (não é envio em massa)"
    - "Segurança da conta, entrega de pedido ou compromisso marcado"
  spam:
    # "pedir_aprovacao": a IA só sugere, você confirma com `python main.py aprovar` (recomendado no início)
    # "automatico": manda para a lixeira sozinho quando a confiança for alta (recuperável por 30 dias)
    modo: "pedir_aprovacao"
    confianca_minima_automatico: 0.95

rastreio:
  # Acompanhamento de encomendas (aba Encomendas). Precisa de uma chave GRÁTIS do 17TRACK em TRACK17_KEY no .env
  # (veja o README). De quanto em quanto tempo consultar as encomendas que ainda não foram entregues (mínimo 15).
  verificar_a_cada_minutos: 60

voz:
  # ATIVAÇÃO POR VOZ (como "Ok Google"): o app fica ouvindo a frase de chamada e, ao ouvi-la, grava o seu comando.
  # Precisa de: pip install -r requirements.txt, e baixar o modelo de voz em Ajustes › Ativação por voz.
  ativada: false
  # Frase que chama o assistente. Precisa existir no vocabulário do modelo de voz (o app avisa se não existir).
  frase_de_ativacao: "ei assistente"
  # Lê a resposta em voz alta quando o pedido foi feito por voz (voz do Windows).
  falar_resposta: true
  # Quem transcreve o comando: "gemini" (acerta mais, usa 1 requisição) ou "local" (grátis, sem internet).
  transcricao: gemini

pc:
  # MODO AUTÔNOMO: o assistente usa o PC sem pedir permissão (abrir apps, tela, teclado, mouse, comandos) e você
  # vê o que ele fez no Histórico. Só para e pergunta se a ação for contra uma regra que você escreveu em Memória › Regras.
  # As travas técnicas (pasta de projetos, programas permitidos, repositórios permitidos) continuam valendo.
  # Coloque false para voltar a ser perguntado a cada ação.
  modo_autonomo: true
  # Minimiza a janela do assistente enquanto ele usa tela, teclado e mouse (para não digitar nela mesma nem
  # tampar o que ele precisa ver). Ela volta sozinha quando ele termina. Coloque false para ela ficar aberta.
  esconder_janela: true
  # Ações de risco médio que podem rodar SEM perguntar no chat. Opções: abrir, projeto_escrever.
  # Ver a tela, teclado/mouse, comandos e enviar ao GitHub SEMPRE pedem confirmação no chat.
  confiar_sem_perguntar: []
  # Ao clicar em "permitir por alguns minutos" na confirmação, tudo é liberado por este tempo.
  janela_de_permissao_minutos: 5
  # Apelidos extras de aplicativos: nome falado -> programa ou protocolo.
  aplicativos: {}

app:
  seu_nome: ""            # como o assistente deve te chamar
  porta: 8765             # porta do app no seu computador
  # Acesso pelo celular: "local" = só neste PC; "rede" = também por outros aparelhos da sua rede/Tailscale.
  # Com "rede" o app exige o código de acesso (veja o README).
  acesso: "local"

tarefas:
  # Quantas chamadas ao Gemini uma tarefa pode gastar antes de pausar e esperar você liberar mais.
  orcamento_de_requisicoes: 60
  # Quanto tempo uma tarefa espera você aprovar uma ação antes de seguir sem ela.
  espera_de_aprovacao_minutos: 45
  # Quando a cota do dia acaba, a tarefa pausa e continua sozinha na renovação.
  retomar_apos_renovacao: true

notificacoes:
  # Avisos no iPhone via app ntfy (grátis). Deixe vazio para desligar. O app gera um tópico no primeiro uso.
  ntfy_topico: ""
  avisar_pedidos: true
  avisar_conclusao: true
  avisar_pausas: true
  avisar_erros: true
  avisar_encomendas: true

projetos:
  # Pasta onde ele cria os projetos (uma subpasta por projeto).
  pasta: "~/assistente-projetos"
  # Ele só envia código ao GitHub para os repositórios desta lista. Vazio = nunca envia.
  # Exemplo: ["seu-usuario/seu-repositorio"]
  repos_permitidos: []
  tempo_limite_comando_segundos: 180

spotify:
  # O Redirect URI cadastrado no painel do Spotify deve ser http://127.0.0.1:<porta>/callback
  porta_login: 8888

arquivos:
  # O assistente SÓ lê arquivos dentro destas pastas. Vazio = não lê nada.
  # Exemplos: "~/Documents/assistente", "C:/Users/voce/Documentos/assistente"
  pastas_permitidas:
    - "~/assistente-arquivos"

agenda:
  dias_a_frente: 7
  expediente: "09:00-18:00"
  bloco_foco_minutos: 90
  preferencias: "Prefiro reuniões à tarde, manhãs livres para trabalho focado, almoço entre 12h e 13h."

automatico:
  triagem_a_cada_minutos: 15
  resumo_diario_as: "08:00"
  analise_agenda_as: "07:30"
