# Suas regras. Edite à vontade; não precisa mexer no código.

ia:
  # Se der erro de "modelo não encontrado", troque pelo nome atual em https://ai.google.dev/gemini-api/docs/models
  modelo: "gemini-3.8-flash"
  # Se a cota do modelo principal acabar (ou ele sair do ar), tenta estes, em ordem.
  # A cota gratuita é separada por modelo, então isso estica o uso do dia.
  modelos_reserva:
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"

# Limites usados pelo medidor de consumo do app. O Gemini não informa a cota restante,
# então o app conta as chamadas e compara com estes números.
# Confira os seus limites reais em https://aistudio.google.com/rate-limit e ajuste aqui.
limites:
  requisicoes_por_dia: 250
  requisicoes_por_minuto: 10
  tokens_por_minuto: 250000
  fuso_renovacao: "America/Los_Angeles"   # a cota diária renova à meia-noite do Pacífico
  hora_renovacao: "00:00"

# Histórico do que o assistente planejou e fez. Se apaga sozinho depois destes dias.
historico:
  dias_de_retencao: 7
  maximo_de_eventos: 5000

email:
  max_por_rodada: 25
  # Emails desses remetentes (parte do endereço ou nome) são SEMPRE importantes e nunca vão para a lixeira
  remetentes_vip:
    - "seuchefe@empresa.com"
    - "banco"
  # O que é "importante de verdade" para você. Escreva do seu jeito:
  criterios_importante:
    - "Pede uma resposta ou decisão minha, ou tem prazo"
    - "Envolve dinheiro, cobrança, contrato, boleto ou documento oficial"
    - "É de uma pessoa real escrevendo diretamente para mim (não é envio em massa)"
    - "Segurança da conta, entrega de pedido ou compromisso marcado"
  spam:
    # "pedir_aprovacao": a IA só sugere, você confirma com `python main.py aprovar` (recomendado no início)
    # "automatico": manda para a lixeira sozinho quando a confiança for alta (recuperável por 30 dias)
    modo: "pedir_aprovacao"
    confianca_minima_automatico: 0.95

pc:
  # Ações de risco médio que podem rodar SEM perguntar no chat. Opções: abrir, projeto_escrever.
  # Ver a tela, teclado/mouse, comandos e enviar ao GitHub SEMPRE pedem confirmação no chat.
  confiar_sem_perguntar: []
  # Ao clicar em "permitir por alguns minutos" na confirmação, tudo é liberado por este tempo.
  janela_de_permissao_minutos: 5
  # Apelidos extras de aplicativos: nome falado -> programa ou protocolo.
  aplicativos: {}

projetos:
  # Pasta onde ele cria os projetos (uma subpasta por projeto).
  pasta: "~/assistente-projetos"
  # Ele só envia código ao GitHub para os repositórios desta lista. Vazio = nunca envia.
  # Exemplo: ["seu-usuario/seu-repositorio"]
  repos_permitidos: []
  tempo_limite_comando_segundos: 180

spotify:
  # O Redirect URI cadastrado no painel do Spotify deve ser http://127.0.0.1:<porta>/callback
  porta_login: 8888

arquivos:
  # O assistente SÓ lê arquivos dentro destas pastas. Vazio = não lê nada.
  # Exemplos: "~/Documents/assistente", "C:/Users/voce/Documentos/assistente"
  pastas_permitidas:
    - "~/assistente-arquivos"

agenda:
  dias_a_frente: 7
  expediente: "09:00-18:00"
  bloco_foco_minutos: 90
  preferencias: "Prefiro reuniões à tarde, manhãs livres para trabalho focado, almoço entre 12h e 13h."

automatico:
  triagem_a_cada_minutos: 15
  resumo_diario_as: "08:00"
  analise_agenda_as: "07:30"
